<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoTube - YouTube Automation Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #FF0000;
            --primary-dark: #CC0000;
            --secondary: #282828;
            --background: #0F0F0F;
            --surface: #1E1E1E;
            --text: #FFFFFF;
            --text-secondary: #AAAAAA;
            --success: #2BA640;
            --warning: #F5A623;
            --error: #D0021B;
        }

        body {
            font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--background);
            color: var(--text);
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: var(--surface);
            padding: 20px 0;
            border-bottom: 2px solid var(--primary);
            margin-bottom: 30px;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: var(--primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .logo h1 {
            font-size: 28px;
            font-weight: 700;
        }

        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-online {
            background: rgba(43, 166, 64, 0.2);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .status-offline {
            background: rgba(208, 2, 27, 0.2);
            color: var(--error);
            border: 1px solid var(--error);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--surface);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            font-size: 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            background: var(--background);
            border: 1px solid #333;
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #333;
            color: white;
        }

        .btn-secondary:hover {
            background: #444;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .video-list {
            list-style: none;
        }

        .video-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: var(--background);
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .video-info {
            flex: 1;
        }

        .video-title {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .video-meta {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s;
        }

        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: rgba(43, 166, 64, 0.2);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .alert-error {
            background: rgba(208, 2, 27, 0.2);
            border: 1px solid var(--error);
            color: var(--error);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--background);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 5px;
        }

        @media (max-width: 968px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-content">
            <div class="logo">
                <div class="logo-icon">▶</div>
                <h1>AutoTube</h1>
            </div>
            <div id="apiStatus" class="status-badge status-offline">
                <span class="status-dot">●</span>
                <span>Checking API...</span>
            </div>
        </div>
    </header>

    <main class="container">
        <div id="alertBox" class="alert"></div>

        <div class="dashboard-grid">
            <!-- Video Creation Form -->
            <div class="card">
                <h2>🎬 Create New Video</h2>
                <form id="videoForm">
                    <div class="form-group">
                        <label for="topic">Video Topic</label>
                        <input type="text" id="topic" placeholder="e.g., 5 AI Tools That Will Change Your Life" required>
                    </div>

                    <div class="form-group">
                        <label for="hook">Hook (0-3 seconds)</label>
                        <textarea id="hook" placeholder="Write an attention-grabbing opening..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="content">Content (3-25 seconds)</label>
                        <textarea id="content" placeholder="Write 3-4 key points (one per line)..." required style="min-height: 120px;"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="cta">Call to Action (25-30 seconds)</label>
                        <textarea id="cta" placeholder="Write your call to action + hashtags..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="title">Video Title</label>
                        <input type="text" id="title" placeholder="Catchy YouTube title" required>
                    </div>

                    <button type="submit" class="btn btn-primary" id="createBtn">
                        🚀 Generate Video
                    </button>
                </form>
            </div>

            <!-- Stats & Recent Videos -->
            <div class="card">
                <h2>📊 Dashboard</h2>
                
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="totalVideos">0</div>
                        <div class="stat-label">Total Videos</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="videosToday">0</div>
                        <div class="stat-label">Created Today</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="storageUsed">0 MB</div>
                        <div class="stat-label">Storage Used</div>
                    </div>
                </div>

                <h3 style="margin: 20px 0 15px; font-size: 18px;">Recent Videos</h3>
                <ul class="video-list" id="videoList">
                    <li class="video-item">
                        <div class="video-info">
                            <div class="video-title">No videos created yet</div>
                            <div class="video-meta">Create your first video above!</div>
                        </div>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Progress Section -->
        <div class="card" id="progressCard" style="display: none;">
            <h2>⏳ Video Generation Progress</h2>
            <div id="progressText" style="margin-bottom: 10px; color: var(--text-secondary);">Initializing...</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
    </main>

    <script>
        // Configuration
        const API_BASE_URL = window.location.hostname === 'localhost' 
            ? 'http://localhost:5001' 
            : '/api';

        // State
        let videos = JSON.parse(localStorage.getItem('autotube_videos') || '[]');
        let isGenerating = false;

        // DOM Elements
        const videoForm = document.getElementById('videoForm');
        const alertBox = document.getElementById('alertBox');
        const apiStatus = document.getElementById('apiStatus');
        const progressCard = document.getElementById('progressCard');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const videoList = document.getElementById('videoList');
        const createBtn = document.getElementById('createBtn');

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            checkAPIHealth();
            updateStats();
            renderVideoList();
        });

        // Check API Health
        async function checkAPIHealth() {
            try {
                const response = await fetch(`${API_BASE_URL}/health`);
                const data = await response.json();
                
                if (data.status === 'healthy') {
                    apiStatus.className = 'status-badge status-online';
                    apiStatus.innerHTML = '<span>●</span><span>API Online</span>';
                } else {
                    throw new Error('API unhealthy');
                }
            } catch (error) {
                apiStatus.className = 'status-badge status-offline';
                apiStatus.innerHTML = '<span>●</span><span>API Offline</span>';
                showAlert('API server is not responding. Make sure the Python container is running.', 'error');
            }
        }

        // Show Alert
        function showAlert(message, type = 'success') {
            alertBox.textContent = message;
            alertBox.className = `alert alert-${type}`;
            alertBox.style.display = 'block';
            
            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 5000);
        }

        // Update Stats
        function updateStats() {
            const today = new Date().toDateString();
            const todayVideos = videos.filter(v => 
                new Date(v.created).toDateString() === today
            );

            const totalSize = videos.reduce((sum, v) => sum + (v.size || 0), 0);

            document.getElementById('totalVideos').textContent = videos.length;
            document.getElementById('videosToday').textContent = todayVideos.length;
            document.getElementById('storageUsed').textContent = `${(totalSize / 1024 / 1024).toFixed(1)} MB`;
        }

        // Render Video List
        function renderVideoList() {
            if (videos.length === 0) {
                videoList.innerHTML = `
                    <li class="video-item">
                        <div class="video-info">
                            <div class="video-title">No videos created yet</div>
                            <div class="video-meta">Create your first video above!</div>
                        </div>
                    </li>
                `;
                return;
            }

            videoList.innerHTML = videos.slice(0, 5).map(video => `
                <li class="video-item">
                    <div class="video-info">
                        <div class="video-title">${escapeHtml(video.title)}</div>
                        <div class="video-meta">${new Date(video.created).toLocaleString()} • ${(video.size / 1024 / 1024).toFixed(2)} MB</div>
                    </div>
                    <button class="btn btn-secondary" onclick="downloadVideo('${video.path}')">Download</button>
                </li>
            `).join('');
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Download Video
        function downloadVideo(path) {
            // In production, this would be a proper download endpoint
            window.open(`/videos/${path.split('/').pop()}`, '_blank');
        }

        // Form Submit Handler
        videoForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (isGenerating) return;

            const formData = {
                hook: document.getElementById('hook').value,
                content: document.getElementById('content').value,
                cta: document.getElementById('cta').value,
                title: document.getElementById('title').value,
                useAiImages: true
            };

            isGenerating = true;
            createBtn.disabled = true;
            createBtn.innerHTML = '⏳ Generating...';
            progressCard.style.display = 'block';

            try {
                // Simulate progress
                simulateProgress();

                const response = await fetch(`${API_BASE_URL}/generate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (result.success) {
                    // Add to video list
                    videos.unshift({
                        title: formData.title,
                        path: result.videoPath,
                        size: result.fileSize,
                        created: new Date().toISOString()
                    });

                    // Save to localStorage
                    localStorage.setItem('autotube_videos', JSON.stringify(videos));

                    showAlert(`Video created successfully! Size: ${(result.fileSize / 1024 / 1024).toFixed(2)} MB`, 'success');
                    
                    // Update UI
                    updateStats();
                    renderVideoList();
                    
                    // Reset form
                    videoForm.reset();
                } else {
                    showAlert(result.error || 'Failed to create video', 'error');
                }
            } catch (error) {
                showAlert(`Error: ${error.message}`, 'error');
            } finally {
                isGenerating = false;
                createBtn.disabled = false;
                createBtn.innerHTML = '🚀 Generate Video';
                progressCard.style.display = 'none';
                progressFill.style.width = '0%';
            }
        });

        // Simulate Progress
        function simulateProgress() {
            let progress = 0;
            const stages = [
                'Generating AI images...',
                'Creating scenes...',
                'Applying transitions...',
                'Adding audio...',
                'Rendering video...'
            ];

            const interval = setInterval(() => {
                if (!isGenerating) {
                    clearInterval(interval);
                    return;
                }

                progress += Math.random() * 10;
                if (progress > 95) progress = 95;

                progressFill.style.width = `${progress}%`;
                const stageIndex = Math.floor(progress / 20);
                progressText.textContent = stages[Math.min(stageIndex, stages.length - 1)];
            }, 500);
        }

        // Auto-generate hook/content from topic
        document.getElementById('topic').addEventListener('blur', async (e) => {
            const topic = e.target.value;
            if (topic.length < 5) return;

            // Could call AI to generate script here
            // For now, just pre-fill title
            if (!document.getElementById('title').value) {
                document.getElementById('title').value = topic.substring(0, 60);
            }
        });
    </script>
</body>
</html>
