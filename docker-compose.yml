version: '3.8'

services:
  # --- Database Layer ---
  postgres:
    image: postgres:15-alpine
    container_name: autotube-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: autotube-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
    networks:
      - internal-net
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- AI & Processing Layer ---
  ollama:
    image: ollama/ollama:latest
    container_name: autotube-ollama
    restart: unless-stopped
    volumes:
      - ./data/ollama:/root/.ollama
    networks:
      - internal-net
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

  tts:
    image: synesthesiam/opentts:latest
    container_name: autotube-tts
    restart: unless-stopped
    volumes:
      - ./data/tts:/root/.local/share/opentts
    networks:
      - internal-net
    expose:
      - "5500"

  # --- Application Layer ---
  python:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: autotube-api
    restart: unless-stopped
    env_file: .env
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DB_HOST=postgres
      - LOG_LEVEL=INFO
      - KLING_API_KEY=${KLING_API_KEY}
      - KLING_API_BASE=${KLING_API_BASE}
    volumes:
      - ./data/tts:/app/data/tts
      - ./videos:/videos
      - ./logs:/app/logs
      - ./assets:/assets
    ports:
      - "5001:5001"
    networks:
      - internal-net
      - public-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: autotube-n8n
    restart: unless-stopped
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - GENERIC_TIMEZONE=${TIMEZONE:-Europe/London}
      - N8N_RESTRICT_FILE_ACCESS_TO=/videos;/scripts;/templates;/assets
    volumes:
      - ./data/n8n:/home/node/.n8n
      - ./videos:/videos
      - ./scripts:/scripts
      - ./templates:/templates
      - ./assets:/assets
    ports:
      - "5678:5678"
    networks:
      - internal-net
      - public-net
    depends_on:
      postgres:
        condition: service_healthy

  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: autotube-files
    restart: unless-stopped
    user: "1000:1000"
    environment:
      - FB_USERNAME=${FILEBROWSER_USER}
      - FB_PASSWORD=${FILEBROWSER_PASS}
    volumes:
      - ./data:/srv/data
      - ./videos:/srv/videos
      - fb-data:/database
    ports:
      - "8080:80"
    networks:
      - public-net
    command: --noauth=false

  # --- Observability Stack ---
  prometheus:
    image: prom/prometheus:latest
    container_name: autotube-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./data/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    networks:
      - internal-net
      - public-net
    depends_on:
      - python

  grafana:
    image: grafana/grafana:latest
    container_name: autotube-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3000:3000"
    networks:
      - internal-net
      - public-net
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:latest
    container_name: autotube-loki
    restart: unless-stopped
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - internal-net

volumes:
  grafana-data:
  loki-data:
  fb-data:

networks:
  internal-net:
    driver: bridge
    internal: true
  public-net:
    driver: bridge
